services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: mascotasegura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: mascotasegura
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mascotasegura"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://mascotasegura:${POSTGRES_PASSWORD}@db:5432/mascotasegura
      APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
