name: Validate dev
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mascotasegura
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mascotasegura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mascotasegura -d mascotasegura_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mascotasegura:ci-only-password@127.0.0.1:5432/mascotasegura_test
      APP_URL: http://localhost:3100
      COOKIE_SECURE: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node -e "require('fs').writeFileSync('.env.local','')"
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run build
      - run: node --env-file=.env.local scripts/ci.mjs
